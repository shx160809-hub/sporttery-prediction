name: Run Prediction

on:
  workflow_dispatch: 

jobs:
  run-predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas requests beautifulsoup4 reportlab

      - name: Run script
        run: |
          # 注意：这里需要填写你真实的主程序路径，如果是 src/main.py 就写这个
          python src/main.py 

      - name: Upload PDF/Result
        uses: actions/upload-artifact@v4
        with:
          name: prediction-results
          path: |
            *.pdf
            predictions/
